<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ass4</title>
</head>
<body>
    <section>

    <h1>Sign-Up Form</h1>

    <form>

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to the Terms and Conditions</label><br><br>

        <input type="submit" value="Sign Up">

    </form>
    </section>

    <main>
    <div>
    <h1>Survey Form</h1>
    </div>
    <div>
    <form>

        <p><strong>How satisfied are you with our website?</strong></p>

        <input type="radio" id="excellent" name="satisfaction" value="Excellent">
        <label for="excellent">Excellent</label><br>

        <input type="radio" id="good" name="satisfaction" value="Good">
        <label for="good">Good</label><br>

        <input type="radio" id="fair" name="satisfaction" value="Fair">
        <label for="fair">Fair</label><br>

        <input type="radio" id="poor" name="satisfaction" value="Poor">
        <label for="poor">Poor</label><br><br>

        <p><strong>Which features do you use? (Select all that apply)</strong></p>

        <input type="checkbox" id="search"  value="Search">
        <label for="search">Search</label><br>

        <input type="checkbox" id="profile" value="Profile">
        <label for="profile">Profile</label><br>

        <input type="checkbox" id="notifications" value="Notifications">
        <label for="notifications">Notifications</label><br>

        <input type="checkbox" id="settings" value="Settings">
        <label for="settings">Settings</label><br><br>

        <input type="submit" value="Submit Survey">

    </form>
    </div>
    </main>

</body>
</html>
